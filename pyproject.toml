[project]
name = "ml_runner"
version = "0.2.0"
description = ""
authors = [{ name = "Ben Wallace", email = "bencwallace@gmail.com" }]
requires-python = "==3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "pytorch-lightning~=2.0.7",
    "hydra-core~=1.3.2",
    "torch~=2.0.1",
    "torchvision~=0.15.2",
]

[project.scripts]
ml_run = "ml_runner.main:main"

[dependency-groups]
dev = [
    "ipython>=8.14.0,<9",
    "black>=23.7.0,<24",
    "pytest>=6.2.5,<7",
    "flake8>=4.0.1,<5",
]

[tool.uv]
default-groups = "all"

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu117" }
torchvision = { index = "pytorch-cu117" }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
